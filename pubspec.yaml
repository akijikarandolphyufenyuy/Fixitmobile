name: fixit
description: "A new Flutter project."
publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  go_router: ^16.2.1
  firebase_core: ^3.4.0   # or latest
  cloud_firestore: ^5.4.0 # if you’re using Firestore
  firebase_auth: ^5.3.0   # if you’re using Authentication
  google_sign_in: ^6.1.5
  flutter_facebook_auth: 7.1.2
  file_selector: ^0.9.1
  url_launcher: ^6.2.5 
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.4 
  intl: ^0.19.0 
  # firebase_core: ^2.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_cloud_firestore: 3.1.0   # null-safe Firestore mock
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/images/
